3.  **Equations to Code**:
    ```python
    # Paper Equation (3):
    # h = LayerNorm(x + Attention(x))

    # Implementation:
    def forward(self, x):
        attn_output = self.attention(x)
        x = x + attn_output  # Residual
        x = self.layer_norm(x)  # Post-norm
        return x
    ```

