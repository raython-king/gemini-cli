#### Phase 4: Mixed Precision Training

1.  **PyTorch Native AMP**:
    ```python
    from torch.cuda.amp import autocast, GradScaler

    scaler = GradScaler()

    for batch in train_loader:
        optimizer.zero_grad()

        with autocast():
            outputs = model(inputs)
            loss = criterion(outputs, targets)

        # Scale loss and backprop
        scaler.scale(loss).backward()

        # Unscale gradients and clip
        scaler.unscale_(optimizer)
        torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)

        # Update weights
        scaler.step(optimizer)
        scaler.update()
    ```

2.  **BF16 Training** (for newer GPUs):
    ```python
    with autocast(dtype=torch.bfloat16):
        outputs = model(inputs)
        loss = criterion(outputs, targets)
    ```

3.  **Selective Mixed Precision**:
    ```python
    # Keep certain layers in FP32
    class MixedPrecisionModel(nn.Module):
        def forward(self, x):
            # FP16 for most computation
            with autocast():
                x = self.backbone(x)

            # FP32 for sensitive operations
            with autocast(enabled=False):
                x = x.float()
                x = self.sensitive_layer(x)

            return x
    ```

#### Phase 5: Distributed Training Setup

1.  **Data Parallel (Single Node, Multi-GPU)**:
    ```python
    # Simple DataParallel
    model = nn.DataParallel(model)

    # DistributedDataParallel (recommended)
    import torch.distributed as dist
    from torch.nn.parallel import DistributedDataParallel as DDP

    def setup(rank, world_size):
        dist.init_process_group("nccl", rank=rank, world_size=world_size)
        torch.cuda.set_device(rank)

    def train(rank, world_size):
        setup(rank, world_size)

        model = MyModel().to(rank)
        model = DDP(model, device_ids=[rank])

        sampler = DistributedSampler(dataset, num_replicas=world_size, rank=rank)
        loader = DataLoader(dataset, sampler=sampler)

        for epoch in range(num_epochs):
            sampler.set_epoch(epoch)  # Important for shuffling
            train_epoch(model, loader)

    # Launch
    import torch.multiprocessing as mp
    mp.spawn(train, args=(world_size,), nprocs=world_size)
    ```

2.  **Model Parallel (Large Models)**:
